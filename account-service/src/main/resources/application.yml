server:
  port: 8083

spring:
  application:
    name: account-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 本地单机部署：显式注册 127.0.0.1，避免换 Wi-Fi/热点后残留过期地址
        ip: 127.0.0.1
        namespace: 4fbcf13a-853a-4f73-90d8-5569f59d827d
        group: DEFAULT_GROUP

alipay:
  app-id: 9021000158636061
  # 应用私钥：给请求签名，证明"请求确实是我发的"
  merchant-private-key: 

  alipay-public-key: 

  notify-url: http://n4a93efc.natappfree.cc/alipay/notify

  return-url: http://localhost:5173/checkout
  # 支付完成后把浏览器跳回前端的地址（前端据此轮询充值状态）
  frontend-url: http://localhost:5173
  sign-type: RSA2
  charset: utf-8
  gateway-url: https://openapi-sandbox.dl.alipaydev.com/gateway.do
