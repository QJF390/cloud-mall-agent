server:
  port: 8083

spring:
  application:
    name: account-service
  cloud:
    nacos:
      discovery:
        server-addr: 127.0.0.1:8848
        # 本地单机部署：显式注册 127.0.0.1，避免换 Wi-Fi/热点后残留过期地址
        ip: 127.0.0.1
        namespace: 4fbcf13a-853a-4f73-90d8-5569f59d827d
        group: DEFAULT_GROUP

alipay:
  # ✅ 沙箱演示应从「支付宝开放平台 → 沙箱应用」自行获取；
  # ✅ 所有敏感项一律走环境变量，不写死、不入库（见 README「配置与安全」）。
  app-id: ${ALIPAY_APP_ID:}
  # 应用私钥：给请求签名，证明"请求确实是我发的"
  merchant-private-key: ${ALIPAY_MERCHANT_PRIVATE_KEY:}
  # 支付宝公钥（注意不是应用公钥）：用来验证支付宝回调确实来自支付宝
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  # notify_url：支付宝【服务器】来调你，必须公网可达——本地开发请自行内网穿透，
  # 隧道域名每次可能变化，用环境变量注入，不要提交到仓库。
  notify-url: ${ALIPAY_NOTIFY_URL:http://localhost:8080/alipay/notify}
  # return_url：支付宝把【用户浏览器】重定向过去，不需要公网可达，本地直连前端即可
  return-url: ${ALIPAY_RETURN_URL:http://localhost:5173/checkout}
  # 支付完成后把浏览器跳回前端的地址（前端据此轮询充值状态）
  frontend-url: ${ALIPAY_FRONTEND_URL:http://localhost:5173}
  sign-type: RSA2
  charset: utf-8
  gateway-url: ${ALIPAY_GATEWAY_URL:https://openapi-sandbox.dl.alipaydev.com/gateway.do}
